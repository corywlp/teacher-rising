<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Teacher Rising — High Impact PD</title>
  <meta property="og:title" content="Teacher Rising — High Impact PD" />
  <meta property="og:description" content="Act 48 approved professional development designed for the real challenges educators are facing right now." />
  <meta property="og:url" content="https://corywlp.github.io/teacher-rising/" />
  <meta property="og:type" content="website" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #1E1E1E;
      color: #F2EDE4;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 40px 24px 120px;
    }
    .logo img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      border-radius: 12px;
    }
    .coming-soon {
      font-family: 'Playfair Display', serif;
      font-size: 4rem;
      font-weight: 900;
      color: #F2EDE4;
      letter-spacing: -0.5px;
      text-align: center;
    }
    .coming-soon span { color: #C9622F; }
    .coming-soon-sub {
      font-size: 1.2rem;
      font-weight: 400;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #A89070;
      text-align: center;
    }
    .one-pager-link {
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #F2EDE4;
      background: #C9622F;
      text-decoration: none;
      padding: 16px 44px;
      border-radius: 4px;
      transition: background 0.2s, transform 0.15s;
    }
    .one-pager-link:hover {
      background: #a84e23;
      transform: translateY(-1px);
    }
  @media (max-width: 600px) {
      body { gap: 18px; padding: 32px 20px 80px; }
      .logo img { width: 90px; height: 90px; }
      .coming-soon { font-size: 2.6rem; }
      .coming-soon-sub { font-size: 1rem; letter-spacing: 1px; }
      .one-pager-link { padding: 14px 32px; font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <div class="logo">
    <img src="logo.jpg" alt="Teacher Rising" />
  </div>
  <div class="coming-soon">Teacher <span>Rising</span></div>
  <a class="one-pager-link" href="one-pager.html">View Our One Pager</a>
  <div class="coming-soon-sub">Full Site Coming Soon</div>
</body>
</html>
